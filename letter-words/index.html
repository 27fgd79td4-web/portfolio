<meta charset="utf-8">

<title>Letter Words</title>
<style>
  :root {
    --bg: #f6f7fb; --card: #ffffff; --text: #1d2233; --muted: #6b7280;
    --accent: #4f46e5; --accent-soft: #eef2ff; --border: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1220; --card: #181c2e; --text: #e8eaf3; --muted: #9aa1b5;
      --accent: #8b8cff; --accent-soft: #23264a; --border: #2a2f47;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 40px 16px;
  }
  h1 { margin: 0 0 6px; font-size: 2rem; }
  p.sub { margin: 0 0 28px; color: var(--muted); text-align: center; }
  input {
    width: 260px; max-width: 100%; height: 120px; font-size: 4rem; letter-spacing: .1em; text-align: center; text-transform: uppercase;
    border: 2px solid var(--border); border-radius: 20px; background: var(--card); color: var(--text);
    outline: none; transition: border-color .15s;
  }
  input:focus { border-color: var(--accent); }
  .results { display: grid; gap: 14px; width: 100%; max-width: 520px; margin-top: 28px; }
  .word {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 20px; display: flex; align-items: baseline; gap: 14px;
    animation: pop .25s ease both;
  }
  .word:nth-child(2) { animation-delay: .05s; }
  .word:nth-child(3) { animation-delay: .1s; }
  .word .n { color: var(--accent); font-weight: 700; }
  .word .w { font-size: 1.5rem; font-weight: 600; }
  .word .w b { color: var(--accent); }
  .word .m { color: var(--muted); margin-left: auto; font-size: .95rem; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  button {
    margin-top: 22px; padding: 12px 22px; font-size: 1rem; border: 0; border-radius: 12px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .4; cursor: default; }
  .hint { color: var(--muted); margin-top: 16px; font-size: .9rem; }
  @media (max-width: 480px) { .word { flex-wrap: wrap; } .word .m { margin-left: 0; width: 100%; } }
</style>
</head>
<body>

  <div class="results" id="results"></div>

  <div class="hint">Tip: just press keys A–Z — no need to click. A fourth letter starts over.</div>

// Word -> Uzbek meaning, for the hand-picked words above.
const MEANING = {};
for (const list of Object.values(WORDS)) for (const [w, m] of list) MEANING[w.toLowerCase()] = m;

const input = document.getElementById("letter");
const results = document.getElementById("results");
const moreBtn = document.getElementById("more");
let current = null;
let lastShown = [];

function candidates(prefix) {
  // Hand-picked words (with translations) first, then the most common words.
  const picked = Object.keys(MEANING).filter(w => w.startsWith(prefix));
  const common = COMMON.filter(w => w.startsWith(prefix) && !(w in MEANING)).slice(0, 30);
  const list = picked.concat(common);
  if (list.length >= 3) return list;
  return list.concat(RARE.filter(w => w.startsWith(prefix)).slice(0, 10));
}

function pickThree(list) {
  // Prefer words not shown last time so "Show 3 more" really changes things.
  const fresh = list.filter(w => !lastShown.includes(w));
  const pool = (fresh.length >= 3 ? fresh : list).slice();
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, 3);
}

function show(prefix) {
  prefix = (prefix || "").toLowerCase();
  if (!/^[a-z]{1,3}$/.test(prefix)) {
    results.innerHTML = prefix ? '<div class="hint">Please type English letters (A–Z).</div>' : "";
    moreBtn.disabled = true;
    current = null;
    return;
  }
  const list = candidates(prefix);
  if (prefix !== current) lastShown = [];
  current = prefix;
  if (!list.length) {
    results.innerHTML = `<div class="hint">No English words start with “${prefix.toUpperCase()}”.</div>`;
    moreBtn.disabled = true;
    return;
  }
  const three = pickThree(list);
  lastShown = three;
  const n = prefix.length;
  results.innerHTML = three.map((w, i) =>
    `<div class="word"><span class="n">${i + 1}.</span>` +
    `<span class="w"><b>${w[0].toUpperCase() + w.slice(1, n)}</b>${w.slice(n)}</span>` +
    `<span class="m">${MEANING[w] || ""}</span></div>`
  ).join("");
  moreBtn.disabled = list.length <= 3;
}

function typeLetter(ch) {
  // Up to 3 letters; a fourth letter starts a new search.
  input.value = input.value.length >= 3 ? ch : input.value + ch;
  show(input.value);
}

input.addEventListener("input", () => {
  let v = input.value.replace(/[^a-zA-Z]/g, "");
  if (v.length > 3) v = v.slice(-1);
  input.value = v.toUpperCase();
  show(v);
});
moreBtn.addEventListener("click", () => show(current));

// Pressing a letter anywhere on the page works too.
document.addEventListener("keydown", e => {
  if (e.target === input || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^[a-zA-Z]$/.test(e.key)) { typeLetter(e.key.toUpperCase()); input.focus(); e.preventDefault(); }
  else if (e.key === "Backspace") { input.value = input.value.slice(0, -1); show(input.value); e.preventDefault(); }
  else if (e.key === " " || e.key === "Enter") { if (current) { show(current); e.preventDefault(); } }
});
